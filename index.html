<style>
/* VOICE the studio's own app, quiet and exact
   IDEA their SOLUM prototype, now working: PIN, chat, register, sheet, archive
   PICTURE the app itself, full screen
   COLOUR black, graphite #1c1c1e, white ink; green and red only for money in and out
   TYPE Oswald throughout, as in their prototype
   LAYOUT bottom navigation on mobile, sidebar on desktop */
:root{color-scheme:dark;--bg:#000;--p1:#121212;--p2:#1c1c1e;--p3:#2c2c2e;--ln:rgba(255,255,255,.1);--mu:#9ca3af;--in:#4ade80;--out:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000;color:#fff}
body{font:16px/1.45 Oswald,'Arial Narrow',sans-serif;letter-spacing:.02em;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#1d1e22 0%,#000 70%)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 18px 10px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(0,0,0,.4)}
header h1{margin:0;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.av{width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#000;font-weight:700;font-size:13px}
.scr{flex:1;overflow-y:auto;padding:14px 16px 16px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.msg{max-width:86%;margin:0 0 10px;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.35}
.me{margin-left:auto;background:var(--p3);border-bottom-right-radius:6px}
.ai{border:1px solid var(--ln);border-bottom-left-radius:6px;color:#e5e7eb}
.draft{background:var(--p2);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:14px;margin:0 0 12px}
.dh{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:0 0 10px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fg label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);display:grid;gap:3px}
.fg .w{grid-column:1/-1}
select,input{font:16px Oswald,sans-serif;letter-spacing:.02em;color:#fff;background:var(--p1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 9px;min-height:42px;width:100%}
.fg label.bad select,.fg label.bad input{border-color:var(--warn)}
.warn{list-style:none;padding:0;margin:10px 0 0;font-size:14px;color:var(--warn)}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:44px;border-radius:999px;border:0;background:#fff;color:#000;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.btn:disabled{opacity:.3;cursor:not-allowed}
.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}
.done{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--p2);border:1px solid var(--ln);border-radius:16px;padding:8px 8px 8px 14px;margin:0 0 12px;font-size:14px}
.done b{color:var(--in)}
.lnk{background:none;border:0;color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.08em;min-height:40px;padding:0 8px}
.lnk:hover{color:#fff}
.sug{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.sug::-webkit-scrollbar{display:none}
.sug button{flex:none;background:rgba(28,28,30,.9);border:1px solid var(--ln);border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;color:#d1d5db}
.comp{padding:0 14px 10px}
.comp form{display:flex;gap:8px;align-items:center;background:rgba(28,28,30,.92);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:5px}
.comp input{border:0;background:transparent;min-height:40px;padding:0 12px}
.comp input::placeholder{color:#6b7280}
.send{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:#fff;color:#000;font-size:18px;font-weight:700}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ln);background:rgba(0,0,0,.85);padding:8px 6px max(14px,env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#6b7280;font-size:19px;font-weight:700;letter-spacing:.12em;min-height:46px}
nav button[aria-pressed=true]{color:#fff}
.seg{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.seg button{background:var(--p2);border:1px solid var(--ln);color:var(--mu);border-radius:999px;padding:6px 14px;min-height:40px;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.seg button[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.row .d{font-size:16px;font-weight:600}
.row .m{font-size:13px;color:var(--mu)}
.amt{font-weight:600;white-space:nowrap;text-align:right}
.in{color:var(--in)}.out{color:var(--out)}
.ra{grid-column:1/-1;display:flex;margin-left:-8px}
.scroll{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}
table.xl{border-collapse:collapse;font:13px system-ui,sans-serif;letter-spacing:0;width:max-content;min-width:100%}
.xl th,.xl td{border:1px solid rgba(255,255,255,.1);padding:5px 8px;white-space:nowrap}
.xl thead th{background:var(--p3);color:var(--mu);font-weight:500}
.xl .rn{background:var(--p3);color:var(--mu);text-align:center}
.xl .hd td{font-weight:600;background:#17171a}
.xl .num{text-align:right;font-variant-numeric:tabular-nums}
.xl .tot td{font-weight:700;border-top:2px solid rgba(255,255,255,.35)}
.note{font-size:13px;color:var(--mu);margin:10px 0 0}
.card{background:var(--p2);border:1px solid var(--ln);border-radius:22px;padding:14px 16px;margin:0 0 12px}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kp div{background:var(--p1);border-radius:14px;padding:10px}
.kp small{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.kp b{font-size:17px;white-space:nowrap}
.prj{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.07);padding:13px 0;text-align:left}
.prj .n{font-size:17px;font-weight:700;letter-spacing:.06em}
.prj .s{font-size:13px;color:var(--mu);white-space:nowrap}
.search{margin:0 0 8px}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
.toast{position:absolute;left:14px;right:14px;bottom:96px;background:#fff;color:#000;border-radius:14px;padding:4px 4px 4px 14px;display:none;justify-content:space-between;align-items:center;z-index:20}
.toast.on{display:flex}
.toast button{background:none;border:0;font-weight:700;min-height:40px;padding:0 12px;text-transform:uppercase;color:#000}
/* login */
.login{position:absolute;inset:0;z-index:40;background:#121212;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:56px 24px 22px;text-align:center}
.login h2{margin:0;font-size:32px;font-weight:700;text-transform:uppercase}
.login .sub{color:var(--mu);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:4px}
.ppl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin-top:30px}
.ppl button{background:none;border:0;display:grid;justify-items:center;gap:6px;color:var(--mu);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ppl span{width:64px;height:64px;border-radius:50%;background:var(--p2);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;border:2px solid transparent}
.ppl button[aria-pressed=true] span{border-color:#fff}
.dots{display:flex;justify-content:center;gap:18px;margin:26px 0 0;height:16px}
.dots i{width:15px;height:15px;border-radius:50%;border:2.5px solid #fff}
.dots i.f{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,70px);gap:16px 26px;justify-content:center}
.keys button{width:70px;height:70px;border-radius:50%;border:0;background:var(--p2);font-size:28px;font-weight:500}
.keys button:active{background:#374151}
.keys .x{background:transparent;font-size:20px}
.ver{font-size:11px;color:#6b7280;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.sheet{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{width:100%;background:var(--p2);border-radius:24px 24px 0 0;padding:20px 18px max(24px,env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.sheet p{margin:0 0 14px;color:var(--mu)}
.sheet b{display:block;color:#fff;font-size:20px}
@media(prefers-reduced-motion:no-preference){.draft,.msg,.done{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

.tools{display:flex;align-items:center;gap:10px}
.language{width:auto;min-height:36px;font-size:14px}
.login>.language{position:absolute;top:12px;right:16px}
.login{overflow:auto;gap:12px}
.done{flex-wrap:wrap}
@media(min-width:800px){
 .app{max-width:none;display:grid;grid-template-columns:205px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto}
 header{grid-column:2;grid-row:1;padding:14px 32px}
 nav{grid-column:1;grid-row:1/-1;display:flex;flex-direction:column;gap:8px;padding:78px 16px 16px;border-right:1px solid var(--ln);border-top:0}
 nav button{border-radius:10px;text-align:left;padding:0 16px;text-transform:uppercase}
 nav button[aria-pressed=true]{background:var(--p2)}
 .scr,.sug,.comp{grid-column:2;width:100%;margin-inline:auto}
 .scr{grid-row:2;max-width:1320px;padding:26px 32px}
 .app[data-view=solum] .scr,.sug,.comp{max-width:980px}
 .sug{grid-row:3;padding-inline:32px}
 .comp{grid-row:4;padding:0 32px 20px}
 .fg{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
 .row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
 .ra{grid-column:2;justify-content:flex-end}
 .sheet{align-items:flex-start;justify-content:flex-end;padding:68px 32px}
 .sheet>div{width:300px;border-radius:16px;border:1px solid var(--ln)}
 .toast{left:auto;bottom:85px;min-width:280px}
 .login{justify-content:center;gap:24px;padding:52px 24px 24px;background:radial-gradient(ellipse at center,#212225,#101010 65%)}
 .login>.language{top:20px;right:32px}
 .ppl{grid-template-columns:repeat(5,minmax(0,1fr))}
 .xl th,.xl td{padding:9px 12px}
}
</style>
</head>

/* --- reading a sentence (simulated; the real version uses an AI model on the server) --- */
function parseAmount(value){
 const text=value.trim();
 if(!/^\d+(?:[.,]\d+)*$/.test(text))return NaN;
 const last=text.search(/[.,]\d{1,2}$/);
 const whole=(last<0?text:text.slice(0,last)).replace(/[.,]/g,'');
 return Number(last<0?whole:whole+'.'+text.slice(last+1));
}
function amountOf(src){
 const m=src.match(/€\s*(\d+(?:[.,]\d+)*)|(\d+(?:[.,]\d+)*)\s*(?:€|euros?\b|eur\b)/i);
 if(!m)return null;
 const v=parseAmount(m[1]||m[2]);
 return Number.isFinite(v)&&v>0?{v,raw:m[0]}:null;
}
function payerOf(src){const t=src.toLowerCase();for(const c in NAMES)if(new RegExp('\\b'+NAMES[c]+'\\b').test(t))return{c};const k=src.match(/\b(AL|MA|FG|LC)\b/);if(k)return{c:k[1]};const u=src.match(/\b([A-Z][a-zàèéìòù]+)\s+(?:(?:ha|hanno)\s+(?:pagato|speso|comprato|anticipato|incassato)|paid|spent|bought|received|pagó|gastó|compró|cobró)/)||src.match(/da parte di\s+([A-Z][a-zàèéìòù]+)/);if(u)return{unknown:u[1]};return{c:me}}
function catOf(t,type){for(const [n,re] of (type==='entrata'?KW_IN:KW_OUT))if(re.test(t))return n;return type==='entrata'?'Onorari':''}
function projOf(t){const m=t.match(/\b(10[1-3])\b/);if(m)return m[1];if(/giulian|residenza|urban residence|residencia urbana/.test(t))return'101';if(/lago|lake/.test(t))return'102';if(/brera|scuola|school|escuela/.test(t))return'103';if(/studio|estudio|general|overhead/.test(t))return'000';return''}
function dateOf(t){const d=new Date();if(/\b(ieri|ayer|yesterday)\b/.test(t))d.setDate(d.getDate()-1);const m=t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);if(m){let y=m[3]?+m[3]:d.getFullYear();if(y<100)y+=2000;return iso(new Date(y,+m[2]-1,+m[1]))}return iso(d)}
function parse(src){
 const t=src.toLowerCase(),a=amountOf(src);
 const type=/incass|ricevut|entrat|ci hanno pagato|received|collected|income|cobr[éeó]|recib[íió]|ingres[óo]/.test(t)?'entrata':'uscita';
 const p=payerOf(src),cat=catOf(t,type);let proj=projOf(t);
 if(!proj&&GENERAL.includes(cat))proj='000';
 let desc=src;if(a)desc=desc.replace(a.raw,'');
 desc=desc.replace(/\b(alessandro|mattia|filippo|lorenzo|ieri|oggi)\b/gi,'').replace(/\b(ho|abbiamo|ha|hanno)\s+(speso|pagato|comprato|incassato|anticipato)\b/i,'').replace(/\s+(?:per|for|para)\s+(?:(?:il|the|el)\s+)?(?:(?:progetto|project|proyecto)\s+)?10[1-3]\b/i,'').replace(/\b(per il|per|di|da)\s*[,.]?\s*$/i,'').replace(/^\s*(?:(?:I|we)\s+(?:spent|paid|bought|received)|received|gasté|pagué|compré|cobré|recibí)\s*/i,'').replace(/^\s*(?:on|en)\s+/i,'').replace(/\s+/g,' ').replace(/^\s*(di|del|della|dei|da|per)\s+/i,'').replace(/^[\s,.:-]+|[\s,.:-]+$/g,'');
 desc=desc.charAt(0).toUpperCase()+desc.slice(1);
 return{id:did++,type,amount:a?a.v:null,payer:p.c||'',unknown:p.unknown||'',cat,proj,date:dateOf(t),desc:desc.slice(0,70),state:'open'};
}

function downloadSheet(){
 const {head,body,tot}=sheetData();
 const csvCell=value=>{
  if(typeof value==='number')return lang==='en'?value.toFixed(2):value.toFixed(2).replace('.',',');
  const str=String(value??'');
  const safe=/^\s*[=+\-@]|^[\t\r\n]/.test(str)?"'"+str:str;
  return '"'+safe.replace(/"/g,'""')+'"';
 };
 const csv=[head,...body,tot].map(row=>row.map(csvCell).join(lang==='en'?',':';')).join('\r\n');

}

 const d=drafts[id];if(!d||validate(d).length)return;
 const r={date:d.date,desc:d.desc,proj:d.proj,cat:d.cat,payer:d.payer,type:d.type,amount:d.amount};
 if(d.editOf){const existing=rows.find(x=>x.id===d.editOf);if(!existing)return;Object.assign(existing,r);persist();delete drafts[id];render(true);return}
 r.id=seq++;rows.push(r);persist();d.state='saved';d.rowId=r.id;
 chat.push({who:'a',render:()=>tr('Salvato. Lo trovi in <b>Studio</b>, nel registro e nel foglio.')});render();
}
function toast(m){$('#tmsg').textContent=m;$('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('on'),6000)}
function startSession(){
 $('#av').textContent=me;chat=[];drafts={};tab='solum';arch='';
 chat.push({who:'a',render:()=>tr('Ciao')+' '+esc(USERS[me][0].split(' ')[0])+'. '+tr('Scrivi una spesa, un incasso o una domanda: preparo la bozza e tu confermi.')});
 render();
}

/* --- login --- */
function drawLogin(){
 $('#ppl').innerHTML=Object.keys(USERS).map(k=>`<button data-u="${k}" aria-pressed="${pick===k}"><span>${k}</span>${esc(tr(USERS[k][1]))}</button>`).join('');
 $('#lt').textContent=pick?tr('Inserisci PIN'):tr('Chi sei?');
 $('#dots').hidden=$('#keys').hidden=!pick;
 [...$('#dots').children].forEach((d,i)=>d.className=i<pin.length?'f':'');
}
$('#ppl').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(!b)return;pick=b.dataset.u;pin='';drawLogin()});
function enterPin(k){
 if(!pick||pin.length===4)return;
 if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;drawLogin();
 if(pin.length===4)setTimeout(()=>{me=pick;pin='';$('#login').hidden=true;startSession()},150);
}
$('#keys').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)enterPin(b.dataset.k)});
document.addEventListener('keydown',e=>{
 if($('#login').hidden||!pick||e.target.tagName==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
 if(/^[0-9]$/.test(e.key)||e.key==='Backspace'){
  e.preventDefault();
  enterPin(e.key==='Backspace'?'⌫':e.key);
 }
});

/* --- events --- */
const app=$('#app');
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='closemenu'&&e.target!==b)return;
 if(a==='tab'){tab=b.dataset.tab;if(tab!=='archive')arch='';render()}
 else if(a==='sv'){sv=b.dataset.v;render()}
 else if(a==='sheet'){sheet=b.dataset.v;render()}
 else if(a==='arch'||a==='open-project'){tab='archive';arch=b.dataset.p;render()}
 else if(a==='confirm')confirm(+b.dataset.id);
 else if(a==='cancel'){const d=drafts[+b.dataset.id];if(d.editOf)delete drafts[d.id];else d.state='cancel';render(true)}
 else if(a==='edit'){const r=rows.find(x=>x.id===+b.dataset.row);const d={...r,id:did++,editOf:r.id,unknown:'',state:'open'};drafts[d.id]=d;render(true)}
 else if(a==='del'){const i=rows.findIndex(x=>x.id===+b.dataset.row);if(i<0)return;lastDel={r:rows[i],i};rows.splice(i,1);render(true);toast(tr('Registrazione eliminata'));persist()}
 else if(a==='restore'){if(lastDel){rows.splice(lastDel.i,0,lastDel.r);lastDel=null;render(true);$('#toast').classList.remove('on');persist()}}
 else if(a==='menu'){$('#mn').textContent=USERS[me][0];$('#mr').textContent=tr(USERS[me][1]);$('#sheet').classList.add('on')}
 else if(a==='closemenu')$('#sheet').classList.remove('on');
 else if(a==='logout'){$('#sheet').classList.remove('on');pick='';pin='';drawLogin();$('#login').hidden=false}
 else if(a==='download')downloadSheet();
 else if(a==='copy'){const S=sheetData(),f=v=>typeof v!=='number'?v:lang==='en'?v.toFixed(2):v.toFixed(2).replace('.',',');const tsv=[S.head,...S.body,S.tot].map(r=>r.map(f).join('\t')).join('\n');const out=$('#cpy');const no=()=>out.textContent=tr('Il browser non consente la copia in questa anteprima.');
  try{navigator.clipboard.writeText(tsv).then(()=>out.textContent=tr('Copiato: incollalo in una cella di Excel.'),no)}catch(_){no()}}
});
function onField(e){
 const el=e.target;
 if(el.id==='ps'){q=el.value;const pos=el.selectionStart;render();const n=$('#ps');n.focus();n.setSelectionRange(pos,pos);return}
 if(!el.dataset||!el.dataset.f)return;const card=el.closest('.draft');const d=drafts[+card.dataset.id];if(!d)return;const f=el.dataset.f;
 if(f==='amount'){const v=parseAmount(el.value);d.amount=isFinite(v)?v:null}else d[f]=el.value;
 if(f==='type'){if(!(d.type==='entrata'?CIN:COUT).includes(d.cat))d.cat=d.type==='entrata'?tr('Onorari'):'';card.outerHTML=form(d);return}
 refresh(card,d);
}
app.addEventListener('input',onField);app.addEventListener('change',e=>{if(e.target.id!=='ps')onField(e)});
$('#f').addEventListener('submit',e=>{e.preventDefault();const i=$('#q');send(i.value);i.value=''});
$('#sug').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)send(b.dataset.s)});

function applyLanguage(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-language]').forEach(el=>el.value=lang);
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));
 $('#q').placeholder=tr('Chiedi o inserisci una spesa…');
 $('#q').setAttribute('aria-label',tr('Messaggio'));
 $('.send').setAttribute('aria-label',tr('Invia'));
 $('#av').setAttribute('aria-label',tr('Profilo'));
 $('#mr').textContent=tr(USERS[me][1]);
 $('#sug').innerHTML=SUG[lang].map(s=>`<button data-s="${esc(s)}">${esc(s)}</button>`).join('');
 $('#keys').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button class="${k==='⌫'?'x':''}" data-k="${k}" aria-label="${k==='⌫'?tr('Cancella'):k}">${k}</button>`:'<span></span>').join('');
 drawLogin();
 render(true);
}
document.querySelectorAll('[data-language]').forEach(el=>el.addEventListener('change',()=>{
 lang=el.value;
 try{localStorage.setItem(languageKey,lang);}catch{}
 applyLanguage();
}));
applyLanguage();
}
</script>
</body>
</html>
